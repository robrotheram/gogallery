deploy:
  authtoken: your-netlify-auth-token
  siteid: your-netlify-site-id

gallery:
  name: "Gallery"
  imagesPerPage: 50
  basepath: "Photos"
  url:      "https://your.url.here"
  theme:    "EmeraldNoir" # Use an embedded theme name or a path to a custom theme.
  albumblacklist: [] # Folder names to exclude from indexing.
  pictureblacklist: [] # Individual images to exclude.
  useoriginal: false # Include the original image in the published site.
  
about:
  photographer: "Joe Blogs"
  backgroundPhoto: "/img/galleryimagename"
  profilePhoto: "url to profile e.g gravatar"
  twitter: "@twitter"
  facebook: "facebook_username"
  instagram: "instagram_username"
  email: "me@example.com"
  blog: "https://blog.example.com"
  website: "https://example.com"
  description: "Hello there, here is my gallery containing a number of photos from a number of years"
  footer: "Photos © Photographer"
